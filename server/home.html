<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life OS</title>
<style>
  :root {
    --bg: #0d1117; --bar: #161b22; --line: #232a33; --txt: #c9d1d9;
    --dim: #6e7681; --hover: #21262d; --bad: #ff7b72;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    display: flex; flex-direction: column; }
  /* min-height (not height): with several tabs the nav wraps to a second row and the
     bar must grow instead of clipping / overlapping the stage. */
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    min-height: 42px; padding: 4px 12px; flex: none;
    background: var(--bar); border-bottom: 1px solid var(--line); user-select: none; }
  .brand { font-weight: 600; color: var(--dim); letter-spacing: .3px; white-space: nowrap; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--txt);
    border: 1px solid transparent; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .tab .tdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tab small { color: var(--dim); margin-left: 4px; font-size: 11px; }
  .tab:hover { background: var(--hover); }
  .tab.active { background: var(--hover); border-color: var(--line); }
  .tab.unreachable { opacity: .45; }
  .spacer { flex: 1; }
  #reloadAll { background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #reloadAll:hover { background: var(--hover); color: var(--txt); }
  #stage { flex: 1 1 0; min-height: 0; display: flex; }
  .pane { display: none; flex-direction: column; min-width: 0; min-height: 0; }
  .pane.show { display: flex; flex: 1 1 0; }
  /* pane-body is the flexing wrapper the iframe/unreachable state renders into;
     without this it collapses to the iframe's default 150px height. */
  .pane-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #stage.all { gap: 1px; background: var(--line); }
  .pane-hd { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px;
    background: var(--bar); border-bottom: 1px solid var(--line); color: var(--dim);
    font-size: 11px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pane-hd .pname { color: var(--txt); font-weight: 600; }
  .badge { border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; font-size: 10px;
    color: var(--dim); }
  .pane-hd .sub { color: var(--dim); }
  .pane-hd .grow { flex: 1; }
  .pane-hd button, .pane-hd a { background: transparent; border: none; color: var(--dim);
    cursor: pointer; text-decoration: none; font-size: 12px; padding: 2px 4px; border-radius: 4px; }
  .pane-hd button:hover, .pane-hd a:hover { background: var(--hover); color: var(--txt); }
  iframe { flex: 1; width: 100%; border: none; background: #fff; }
  .unreach-pane { flex: 1; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: var(--dim); background: #0a0e13; text-align: center; }
  .unreach-pane button { background: var(--hover); color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  #empty, #jsonError { display: none; flex: 1 1 0; min-height: 0; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: var(--dim); text-align: center; }
  #empty button, #jsonError button { background: var(--hover); color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  #jsonError .msg { color: var(--bad); max-width: 480px; }
</style>
</head>
<body>
  <header id="bar">
    <span class="brand">Life OS</span>
    <nav id="tabs"></nav>
    <span class="spacer"></span>
    <button id="reloadAll" title="Reload every dashboard">&#8635; Reload all</button>
  </header>
  <main id="stage"></main>
  <div id="empty">
    <div>No dashboards defined.<br>Check <code>dashboards.json</code>.</div>
    <button id="retryEmpty">&#8635; Retry</button>
  </div>
  <div id="jsonError">
    <div>Couldn't load <code>dashboards.json</code>.</div>
    <div class="msg" id="jsonErrorMsg"></div>
    <button id="retryJson">&#8635; Retry</button>
  </div>

<script>
  var MANIFEST_URL = "./dashboards.json";
  var PROBE_TIMEOUT_MS = 2500;
  var HOME_GROUP = "home";

  var stage = document.getElementById("stage");
  var tabsEl = document.getElementById("tabs");
  var emptyEl = document.getElementById("empty");
  var jsonErrorEl = document.getElementById("jsonError");
  var jsonErrorMsgEl = document.getElementById("jsonErrorMsg");

  var dashboards = [];       // sorted, from manifest
  var reachable = {};        // id -> true/false/undefined(unknown yet)

  function argbToHex(s) {
    // "0xFF8FB96A" -> "#8FB96A" (drop leading 0x + alpha byte)
    if (!s) return "#c9d1d9";
    var h = String(s).replace(/^0x/i, "");
    if (h.length === 8) h = h.slice(2); // strip alpha
    return "#" + h;
  }

  function kindBadge(kind) {
    if (kind === "editable") return "editable";
    if (kind === "viewonly" || kind === "view-only") return "view-only";
    return kind || "";
  }

  function fetchWithTimeout(url, opts, ms) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url, Object.assign({}, opts, { signal: ctrl.signal })).finally(function () {
      clearTimeout(t);
    });
  }

  function probeReachable(url) {
    return fetchWithTimeout(url, { method: "HEAD", mode: "no-cors" }, PROBE_TIMEOUT_MS)
      .then(function () { return true; })
      .catch(function () {
        return fetchWithTimeout(url, { method: "GET", mode: "no-cors" }, PROBE_TIMEOUT_MS)
          .then(function () { return true; })
          .catch(function () { return false; });
      });
  }

  function paneHtml(d) {
    var color = argbToHex(d.color);
    return (
      '<div class="pane-hd">' +
        '<span class="dot" style="background:' + color + '"></span>' +
        '<span class="pname">' + d.label + '</span>' +
        '<span class="badge">' + kindBadge(d.kind) + '</span>' +
        '<span class="sub">' + (d.subtitle || "") + '</span>' +
        '<span class="grow"></span>' +
        '<button class="reload" title="Reload this dashboard">&#8635;</button>' +
        '<a href="' + d.url + '" target="_blank" title="Open in a normal browser tab">&#8599;</a>' +
      '</div>' +
      '<div class="pane-body"></div>'
    );
  }

  function unreachHtml() {
    return '<div class="unreach-pane">' +
      '<div>unreachable &mdash; is the service up?</div>' +
      '<button class="retry-pane">&#8635; Retry</button>' +
      '</div>';
  }

  function iframeHtml(url) {
    return '<iframe data-url="' + url + '" src="' + url + '"></iframe>';
  }

  function renderPaneBody(pane, d) {
    var body = pane.querySelector(".pane-body");
    var ok = reachable[d.id];
    if (ok === false) {
      body.innerHTML = unreachHtml();
      body.querySelector(".retry-pane").addEventListener("click", function () {
        recheckOne(d, pane);
      });
    } else {
      body.innerHTML = iframeHtml(d.url);
    }
    pane.classList.toggle("unreachable", ok === false);
  }

  function recheckOne(d, pane) {
    probeReachable(d.url).then(function (ok) {
      reachable[d.id] = ok;
      renderPaneBody(pane, d);
      updateTabReachability(d);
    });
  }

  function updateTabReachability(d) {
    var tab = tabsEl.querySelector('.tab[data-mode="' + d.id + '"]');
    if (tab) tab.classList.toggle("unreachable", reachable[d.id] === false);
  }

  function build(list) {
    dashboards = list.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    tabsEl.innerHTML = "";
    stage.innerHTML = "";
    stage.className = "";
    emptyEl.style.display = "none";
    jsonErrorEl.style.display = "none";

    if (!dashboards.length) { emptyEl.style.display = "flex"; return; }

    var homeGroup = dashboards.filter(function (d) { return d.group === HOME_GROUP; });

    dashboards.forEach(function (d) {
      var pane = document.createElement("section");
      pane.className = "pane";
      pane.setAttribute("data-inst", d.id);
      pane.innerHTML = paneHtml(d);
      renderPaneBody(pane, d);
      pane.querySelector(".reload").addEventListener("click", function () {
        var f = pane.querySelector("iframe");
        if (f) f.src = f.getAttribute("data-url");
      });
      stage.appendChild(pane);
    });

    dashboards.forEach(function (d, i) {
      var color = argbToHex(d.color);
      var btn = document.createElement("button");
      btn.className = "tab" + (i === 0 ? " active" : "") + (reachable[d.id] === false ? " unreachable" : "");
      btn.setAttribute("data-mode", d.id);
      btn.innerHTML = '<span class="tdot" style="background:' + color + '"></span>' + d.label +
        '<small>' + kindBadge(d.kind) + '</small>';
      btn.addEventListener("click", function () { setMode(d.id, color); });
      tabsEl.appendChild(btn);
    });

    var allBtn = document.createElement("button");
    allBtn.className = "tab";
    allBtn.setAttribute("data-mode", "all");
    allBtn.textContent = "All (" + homeGroup.map(function (d) { return d.label; }).join(" + ") + ")";
    allBtn.addEventListener("click", function () { setMode("all", "#c9d1d9"); });
    tabsEl.appendChild(allBtn);

    setMode(dashboards[0].id, argbToHex(dashboards[0].color));
  }

  function setMode(mode, color) {
    document.querySelectorAll(".tab").forEach(function (b) {
      var on = b.getAttribute("data-mode") === mode;
      b.classList.toggle("active", on);
      b.style.boxShadow = on ? ("inset 0 -2px 0 " + (color || "#c9d1d9")) : "";
    });
    stage.className = mode === "all" ? "all" : "";
    document.querySelectorAll(".pane").forEach(function (p) {
      var isHomeGroupPane = dashboards.some(function (d) {
        return d.id === p.getAttribute("data-inst") && d.group === HOME_GROUP;
      });
      var show = mode === "all" ? isHomeGroupPane : p.getAttribute("data-inst") === mode;
      p.classList.toggle("show", show);
    });
  }

  document.getElementById("reloadAll").addEventListener("click", function () {
    document.querySelectorAll("#stage iframe").forEach(function (f) {
      f.src = f.getAttribute("data-url");
    });
  });
  document.getElementById("retryEmpty").addEventListener("click", function () { load(); });
  document.getElementById("retryJson").addEventListener("click", function () { load(); });

  function checkReachability(list) {
    return Promise.all(list.map(function (d) {
      return probeReachable(d.url).then(function (ok) { reachable[d.id] = ok; });
    }));
  }

  function load() {
    jsonErrorEl.style.display = "none";
    emptyEl.style.display = "none";
    fetch(MANIFEST_URL, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var list = (data && data.dashboards) || [];
        return checkReachability(list).then(function () { build(list); });
      })
      .catch(function (err) {
        jsonErrorMsgEl.textContent = String(err && err.message ? err.message : err);
        jsonErrorEl.style.display = "flex";
      });
  }

  load();
</script>
</body>
</html>
